name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python formatting
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-dev.txt
          ruff format --check beatmate tests
      - name: Offline regression suite
        env:
          BEATMATE_AUDIO_PROVIDER: mock
          BEATMATE_AUDIO_LIVE: '0'
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - run: npm run format:check
        working-directory: tests/browser
      - name: Check native browser modules
        run: |
          for file in beatmate/ui/*.js; do node --check "$file"; done
          node --test tests/ui/*.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-failure-traces
          path: tests/browser/test-results/
          retention-days: 7
